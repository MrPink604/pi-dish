[package]
name = "pi-dish-vault-listener"
description = "Bitwarden Agent Access listener whose approvals come from pi-dish"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "0BSD"
publish = false

[[bin]]
name = "pi-dish-vault-listener"
path = "src/main.rs"

# Pinned to the agent-access v0.11.0 tag so the listener speaks the same
# protocol as the released `aac` v0.11.0 CLI the agents run.
[dependencies]
ap-client = { git = "https://github.com/bitwarden/agent-access", rev = "3b000d15af71be5ddcf8893b099f3a66d386be9d" }
ap-noise = { git = "https://github.com/bitwarden/agent-access", rev = "3b000d15af71be5ddcf8893b099f3a66d386be9d" }
ap-proxy-protocol = { git = "https://github.com/bitwarden/agent-access", rev = "3b000d15af71be5ddcf8893b099f3a66d386be9d" }
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rpassword = "7"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[lints.clippy]
unwrap_used = "deny"
