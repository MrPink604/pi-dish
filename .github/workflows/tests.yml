name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: System and bridge test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh build-essential python3
          npm install --prefix "$RUNNER_TEMP/pi-dish-tools" --no-audit --no-fund bun@1.3.14
          echo "$RUNNER_TEMP/pi-dish-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - name: Backend, bridge and lifecycle tests
        env:
          PI_DISH_PI_COMMAND: ${{ github.workspace }}/node_modules/.bin/pi
        run: npm test

  browser:
    name: Browser (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh build-essential python3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:ui:scenarios
      - run: npm run test:ui
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
